name: Replace legacy GitHub Pages with redirects

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/github-pages-redirect.yml'
      - 'apps/f-flow-portal/public/markdown/**'
      - 'scripts/generate-github-pages-redirects.mjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate redirect-only Pages artifact
        run: node scripts/generate-github-pages-redirects.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: tmp/github-pages-redirect

      - name: Deploy GitHub Pages redirects
        id: deployment
        uses: actions/deploy-pages@v4
